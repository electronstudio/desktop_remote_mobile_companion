name: Build

on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FFMPEG_VERSION: "8.1.2"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get-version
        run: |
          version=$(cat server/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: get-version
    runs-on: ubuntu-22.04

    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/ffmpeg
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            pkg-config \
            libdrm-dev \
            libva-dev \
            libgl1 libegl1 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libx11-6 libxcursor1 libxrandr2 libxinerama1 libxi6 \
            libxkbcommon-dev libgl1-mesa-dev libopengl-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxft-dev

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-linux-ubuntu22.04-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build FFmpeg from source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz"
          tar -C /tmp -xJf /tmp/ffmpeg.tar.xz
          cd "/tmp/ffmpeg-${{ env.FFMPEG_VERSION }}"
          ./configure \
            --prefix="${{ env.FFMPEG_PREFIX }}" \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-version3 \
            --enable-libdrm \
            --enable-vaapi \
            --disable-doc \
            --disable-programs \
            --disable-ffplay \
            --disable-ffprobe
          make -j"$(nproc)"
          make install

      - name: Build
        env:
          CGO_CFLAGS: "-I${{ env.FFMPEG_PREFIX }}/include"
          CGO_LDFLAGS: "-L${{ env.FFMPEG_PREFIX }}/lib"
          PKG_CONFIG_PATH: "${{ env.FFMPEG_PREFIX }}/lib/pkgconfig"
          PKG_CONFIG: "pkg-config --static"
        run: go build -o companion -ldflags "-linkmode external" ./cmd/companion

      - name: Build GUI (companion_gui)
        run: go build -tags migrated_fynedo -o companion_gui -ldflags "-linkmode external" ./cmd/companion_gui

      - name: Stage artifact
        run: |
          name="desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp companion "dist/$name/"
          cp companion_gui "dist/$name/"
          cp README.md LICENSE "dist/$name/"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}


  build-windows:
    needs: get-version
    runs-on: windows-2022

    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            make
            diffutils
            patch

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-msys2-mingw64-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Set FFmpeg prefix
        shell: msys2 {0}
        run: |
          echo "FFMPEG_PREFIX=$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg" >> "$GITHUB_ENV"
          echo "FFMPEG_TARBALL=$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg-${FFMPEG_VERSION}.tar.xz" >> "$GITHUB_ENV"

      # Download outside MSYS2. curl inside the MSYS2/mingw environment
      # intermittently fails the TLS handshake to ffmpeg.org's CDN with
      # "curl: (35) Recv failure: Connection reset by peer", while the
      # native Windows curl (Schannel) / Invoke-WebRequest works reliably.
      - name: Download FFmpeg source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://ffmpeg.org/releases/ffmpeg-${env:FFMPEG_VERSION}.tar.xz"
          $out = Join-Path $env:GITHUB_WORKSPACE "ffmpeg-${env:FFMPEG_VERSION}.tar.xz"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "Attempt $i downloading $url"
            try {
              & curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 3 `
                --connect-timeout 30 -o $out $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $out)) { $ok = $true; break }
            } catch {
              Write-Host "Exception: $_"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "Failed to download FFmpeg source after 5 attempts" }
          Write-Host "Downloaded $((Get-Item $out).Length) bytes to $out"

      - name: Build FFmpeg from source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p /tmp
          tar -C /tmp -xJf "${FFMPEG_TARBALL}"
          cd "/tmp/ffmpeg-${FFMPEG_VERSION}"

          # Work around Windows command-line length limits when archiving
          # many object files into the static libraries.
          patch -p1 <<'PATCH' || true
          diff --git a/ffbuild/library.mak b/ffbuild/library.mak
          index 793e9d41fa..e3c15e1d67 100644
          --- a/ffbuild/library.mak
          +++ b/ffbuild/library.mak
          @@ -35,7 +35,8 @@ OBJS += $(SHLIBOBJS)
           endif
           $(SUBDIR)$(LIBNAME): $(OBJS) $(STLIBOBJS)
          	$(RM) $@
          -	$(AR) $(ARFLAGS) $(AR_O) $^
          +	$(file > objs.txt, $^)
          +	$(AR) $(ARFLAGS) $(AR_O) @objs.txt
          	$(RANLIB) $@

           install-headers: install-lib$(NAME)-headers install-lib$(NAME)-pkgconfig
          PATCH

          ./configure \
            --prefix="${FFMPEG_PREFIX}" \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-version3 \
            --disable-doc \
            --disable-programs \
            --disable-ffplay \
            --disable-ffprobe
          make -j"$(nproc)"
          make install

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Set Windows build environment
        shell: msys2 {0}
        run: |
          echo "CGO_CFLAGS=-I$FFMPEG_PREFIX/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$FFMPEG_PREFIX/lib -lntdll -lsetupapi" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG=pkg-config --static" >> $GITHUB_ENV

      - name: Verify FFmpeg pkg-config files
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          which pkg-config
          pkg-config --version
          ls -la "$FFMPEG_PREFIX/lib/pkgconfig/" || true
          pkg-config --list-all | grep -i '^libav' || true
          pkg-config --cflags libavcodec || true

      - name: Build
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          go build -ldflags "-linkmode external" -o companion.exe ./cmd/companion

      - name: Stage artifact
        shell: msys2 {0}
        run: |
          name="desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp companion.exe "dist/$name/"/
          cp README.md LICENSE "dist/$name/"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}

