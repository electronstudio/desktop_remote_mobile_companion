name: Build

on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get-version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: get-version
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Build
        run: go build

      - name: Stage artifact
        run: |
          name="desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp desktop_remote_mobile_companion "dist/$name/"
          cp README.md LICENSE "dist/$name/"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/desktop_remote_mobile_companion-linux-x86_64-${{ needs.get-version.outputs.version }}


  build-windows:
    needs: get-version
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Build
        shell: bash
        run: |
          go build

      - name: Stage artifact
        shell: bash
        run: |
          name="desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp desktop_remote_mobile_companion.exe "dist/$name/"/
          cp README.md LICENSE "dist/$name/"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/desktop_remote_mobile_companion-windows-x86_64-${{ needs.get-version.outputs.version }}

