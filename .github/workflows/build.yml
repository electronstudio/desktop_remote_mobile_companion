name: Build

on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FFMPEG_VERSION: "8.1.2"
  # x264 commit (stable branch), pinned for reproducible builds.
  X264_REF: "31e19f92f00c7003fa115047ce50978bc98c3a0d"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get-version
        run: |
          version=$(cat server/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: get-version
    runs-on: ubuntu-22.04

    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/ffmpeg
      CGO_ENABLED: "1"
      CGO_CFLAGS: -I${{ github.workspace }}/ffmpeg/include
      # FFmpeg's libavcodec.pc does not list x264 in Requires.private, so add
      # it (and its static deps) explicitly or the final link fails with
      # undefined x264_* references.
      CGO_LDFLAGS: -L${{ github.workspace }}/ffmpeg/lib -lx264 -lstdc++ -lm -lpthread -ldl
      PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg/lib/pkgconfig
      PKG_CONFIG: pkg-config --static

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            pkg-config \
            libdrm-dev \
            libva-dev \
            libgl1 libegl1 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libx11-6 libxcursor1 libxrandr2 libxinerama1 libxi6 \
            libxkbcommon-dev libgl1-mesa-dev libopengl-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxft-dev libxxf86vm-dev libnuma1 libnuma-dev


      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-linux-ubuntu22.04-${{ hashFiles('.github/workflows/build.yml') }}

      # Install into the FFmpeg prefix (writable without sudo, covered by
      # the FFmpeg cache, and already on PKG_CONFIG_PATH) rather than the
      # default /usr/local, which the runner user cannot write to.
      - name: Build nv-codec-headers
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
          cd nv-codec-headers
          make install PREFIX="${{ env.FFMPEG_PREFIX }}"

      - name: Build x264 from source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/x264.tar.gz "https://code.videolan.org/videolan/x264/-/archive/${{ env.X264_REF }}/x264-${{ env.X264_REF }}.tar.gz"
          tar -C /tmp -xzf /tmp/x264.tar.gz
          cd "/tmp/x264-${{ env.X264_REF }}"
          ./configure \
            --prefix="${{ env.FFMPEG_PREFIX }}" \
            --enable-static \
            --disable-shared \
            --disable-cli \
            --disable-opencl \
            --enable-pic
          make -j"$(nproc)"
          make install

      - name: Build FFmpeg from source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz"
          tar -C /tmp -xJf /tmp/ffmpeg.tar.xz
          cd "/tmp/ffmpeg-${{ env.FFMPEG_VERSION }}"
          ./configure \
            --prefix="${{ env.FFMPEG_PREFIX }}" \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-version3 \
            --enable-libx264 \
            --enable-nvenc \
            --enable-libdrm \
            --enable-vaapi \
            --enable-swresample \
            --disable-doc \
            --disable-programs \
            --disable-ffplay \
            --disable-ffprobe
          make -j"$(nproc)"
          make install

      - name: Build
        run: go build -o inara -ldflags "-s -w -linkmode external" ./cmd/inara

      - name: Build GUI (inara_gui)
        run: go build -tags migrated_fynedo -o inara_gui -ldflags "-s -w -linkmode external" ./cmd/inara_gui

      - name: Stage artifact
        run: |
          name="inara-linux-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp inara "dist/$name/"
          cp inara_gui "dist/$name/"
          cp README.md LICENSE inara.desktop.in inara.service.in install.sh uninstall.sh server/static/icon-512.png "dist/$name/"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: inara-linux-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/inara-linux-x86_64-${{ needs.get-version.outputs.version }}

      - name: Build Debian package
        run: |
          set -euo pipefail
          version="${{ needs.get-version.outputs.version }}-1"
          arch=amd64
          pkg=inara
          root="build/deb/${pkg}"

          # Generate shared-library dependencies from the built binaries
          # (FFmpeg is statically linked, so only glibc/X11/GL/wayland
          # GUI libs appear). setcap in postinst comes from libcap2-bin.
          # dpkg-shlibdeps refuses to run without a debian/control, so
          # create a minimal temporary one just for the dependency scan.
          mkdir -p debian
          printf 'Source: %s\nMaintainer: Richard Smith <deb@electronstudio.co.uk>\n\nPackage: %s\nArchitecture: %s\nDescription: temporary control for dpkg-shlibdeps\n' \
            "${pkg}" "${pkg}" "${arch}" > debian/control
          deps=$(dpkg-shlibdeps -O inara inara_gui \
            | sed -e 's/^shlibs:Depends=//' -e 's/, /\n/g' | sort -u | paste -sd, - | sed 's/,/, /g')
          rm -rf debian
          deps="${deps}, libcap2-bin"

          # Data tree, mirroring `make install DESTDIR=... PREFIX=/usr`.
          install -Dm755 inara "${root}/usr/bin/inara"
          install -Dm755 inara_gui "${root}/usr/bin/inara_gui"
          mkdir -p "${root}/usr/share/applications" "${root}/usr/lib/systemd/user"
          sed 's|@BINDIR@|/usr/bin|' inara.desktop.in \
            > "${root}/usr/share/applications/inara.desktop"
          sed 's|@BINDIR@|/usr/bin|' inara.service.in \
            > "${root}/usr/lib/systemd/user/inara.service"
          install -Dm644 server/static/icon-512.png \
            "${root}/usr/share/icons/hicolor/512x512/apps/inara.png"
          install -Dm644 LICENSE \
            "${root}/usr/share/doc/${pkg}/copyright"

          # Control files (setcap is done by postinst, which runs as root).
          mkdir -p "${root}/DEBIAN"
          sed -e "s/@VERSION@/${version}/" -e "s/@ARCH@/${arch}/" \
              -e "s/@DEPENDS@/${deps}/" packaging/deb/control \
              > "${root}/DEBIAN/control"
          install -m755 packaging/deb/postinst "${root}/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "${root}" \
            "dist/${pkg}_${version}_${arch}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: inara-deb-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/inara_*.deb


  build-windows:
    needs: get-version
    runs-on: windows-2022

    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            make
            diffutils
            patch
            mingw-w64-x86_64-ffnvcodec-headers

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-msys2-mingw64-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Set FFmpeg prefix
        shell: msys2 {0}
        run: |
          echo "FFMPEG_PREFIX=$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg" >> "$GITHUB_ENV"
          echo "FFMPEG_TARBALL=$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg-${FFMPEG_VERSION}.tar.xz" >> "$GITHUB_ENV"
          echo "X264_TARBALL=$(cygpath -u "$GITHUB_WORKSPACE")/x264-${X264_REF}.tar.gz" >> "$GITHUB_ENV"

      # Download outside MSYS2. curl inside the MSYS2/mingw environment
      # intermittently fails TLS handshakes with
      # "curl: (35) Recv failure: Connection reset by peer", while the
      # native Windows curl (Schannel) works reliably.
      - name: Download FFmpeg and x264 sources
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          function Fetch([string]$url, [string]$out) {
            for ($i = 1; $i -le 5; $i++) {
              Write-Host "Attempt $i downloading $url"
              try {
                & curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 3 `
                  --connect-timeout 30 -o $out $url
                if ($LASTEXITCODE -eq 0 -and (Test-Path $out)) {
                  Write-Host "Downloaded $((Get-Item $out).Length) bytes to $out"
                  return
                }
              } catch {
                Write-Host "Exception: $_"
              }
              Start-Sleep -Seconds 5
            }
            throw "Failed to download $url after 5 attempts"
          }
          Fetch "https://ffmpeg.org/releases/ffmpeg-${env:FFMPEG_VERSION}.tar.xz" `
                (Join-Path $env:GITHUB_WORKSPACE "ffmpeg-${env:FFMPEG_VERSION}.tar.xz")
          Fetch "https://code.videolan.org/videolan/x264/-/archive/${env:X264_REF}/x264-${env:X264_REF}.tar.gz" `
                (Join-Path $env:GITHUB_WORKSPACE "x264-${env:X264_REF}.tar.gz")

      # The AMF repo has grown to ~10k files of test/media content, so clone
      # only the public headers. Install them into the MinGW64 compiler's
      # default include path ($MINGW_PREFIX/include/AMF) so no --extra-cflags
      # is needed; /usr/local/include is the MSYS2 (not mingw-w64) prefix and
      # is not searched by the mingw-w64 gcc, which caused FFmpeg's configure
      # to fail its AMF/LoadLibrary checks with "ERROR: amf requested ...".
      - name: install amf
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          cd AMF
          git sparse-checkout set amf/public/include
          # Headers are included as <AMF/core/...>, so the contents of
          # amf/public/include go into $MINGW_PREFIX/include/AMF.
          dest="${MINGW_PREFIX}/include/AMF"
          mkdir -p "$dest"
          cp -r amf/public/include/* "$dest/"
          test -f "$dest/core/Version.h"
          ls "$dest/core/Version.h" "$dest/components/VideoEncoderVCE.h"

      - name: Build FFmpeg from source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p /tmp
          export PKG_CONFIG_PATH="${FFMPEG_PREFIX}/lib/pkgconfig"

          # Static-only x264, installed into the same prefix as FFmpeg so
          # FFmpeg's configure finds it via pkg-config and it is statically
          # linked into the final binaries.
          tar -C /tmp -xzf "${X264_TARBALL}"
          cd "/tmp/x264-${X264_REF}"
          ./configure \
            --prefix="${FFMPEG_PREFIX}" \
            --enable-static \
            --disable-shared \
            --disable-cli \
            --disable-opencl \
            --enable-pic
          make -j"$(nproc)"
          make install

          tar -C /tmp -xJf "${FFMPEG_TARBALL}"
          cd "/tmp/ffmpeg-${FFMPEG_VERSION}"

          # FFmpeg >= 8.0 supports GNU ar response files natively
          # (configure auto-detects them and ffbuild/library.mak passes the
          # object list via a response file), so the long-command-line
          # workaround patch is no longer needed.
          ./configure \
            --extra-cflags="-I/usr/local/include/AMF" \
            --prefix="${FFMPEG_PREFIX}" \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-version3 \
            --enable-libx264 \
            --enable-nvenc \
            --enable-swresample \
            --enable-amf \
            --disable-doc \
            --disable-programs \
            --disable-ffplay \
            --disable-ffprobe
          make -j"$(nproc)"
          make install

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"

      - name: Set Windows build environment
        shell: msys2 {0}
        run: |
          echo "CGO_CFLAGS=-I$FFMPEG_PREFIX/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$FFMPEG_PREFIX/lib -static -static-libgcc -static-libstdc++ -lntdll -lsetupapi -lx264" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG=pkg-config --static" >> $GITHUB_ENV

      - name: Verify FFmpeg pkg-config files
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          which pkg-config
          pkg-config --version
          ls -la "$FFMPEG_PREFIX/lib/pkgconfig/" || true
          pkg-config --list-all | grep -iE '^(libav|x264)' || true
          pkg-config --cflags libavcodec || true

      - name: Build
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          go build -ldflags "-s -w -linkmode external" -o inara.exe ./cmd/inara
          go build -tags migrated_fynedo -ldflags "-H=windowsgui -s -w -linkmode external" -o inara_gui.exe ./cmd/inara_gui

      - name: Stage artifact
        shell: msys2 {0}
        run: |
          name="inara-windows-x86_64-${{ needs.get-version.outputs.version }}"
          mkdir -p "dist/$name"
          cp inara.exe inara_gui.exe "dist/$name/"
          cp README.md LICENSE "dist/$name/"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: inara-windows-x86_64-${{ needs.get-version.outputs.version }}
          path: dist/inara-windows-x86_64-${{ needs.get-version.outputs.version }}

