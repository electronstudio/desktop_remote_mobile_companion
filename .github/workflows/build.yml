  combine:
    needs: [get-version, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: inara-*-${{ needs.get-version.outputs.version }}

      - name: Build combined archives
        run: |
          sudo apt update
          sudo apt install -y makeself
          version="${{ needs.get-version.outputs.version }}"
          outdir="dist/inara-all-$version"
          mkdir -p "$outdir"
          for dir in artifacts/inara-*; do
            name=$(basename "$dir")
            if [[ "$name" == inara-linux-* ]]; then
              chmod +x "artifacts/$name/inara"
              chmod +x "artifacts/$name/inara_gui"
              chmod +x "artifacts/$name/install.sh"
              chmod +x "artifacts/$name/uninstall.sh"
              (cd artifacts && tar -cJf "../$outdir/$name.tar.xz" "$name")
              makeself --xz "artifacts/$name" "$outdir/$name.installer.run" "Inara installer" ./install.sh
            elif [[ "$name" == inara-deb-* ]]; then
              cp "artifacts/$name"/*.deb "$outdir/"
            else
              (cd artifacts && zip -r "../$outdir/$name.zip" "$name")
            fi
          done

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: inara-all-${{ needs.get-version.outputs.version }}
          path: dist/inara-all-${{ needs.get-version.outputs.version }}
