  combine:
    needs: [get-version, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop_remote_mobile_companion-*-${{ needs.get-version.outputs.version }}

      - name: Build combined archives
        run: |
          version="${{ needs.get-version.outputs.version }}"
          outdir="dist/desktop_remote_mobile_companion-all-$version"
          mkdir -p "$outdir"
          for dir in artifacts/desktop_remote_mobile_companion-*; do
            name=$(basename "$dir")
            if [[ "$name" == desktop_remote_mobile_companion-linux-* ]]; then
              chmod +x "artifacts/$name/companion"
              (cd artifacts && tar -cJf "../$outdir/$name.tar.xz" "$name")
            else
              (cd artifacts && zip -r "../$outdir/$name.zip" "$name")
            fi
          done

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop_remote_mobile_companion-all-${{ needs.get-version.outputs.version }}
          path: dist/desktop_remote_mobile_companion-all-${{ needs.get-version.outputs.version }}
