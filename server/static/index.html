<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="app-version" content="{{VERSION}}">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{TITLE}}">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: none;
    }
    .area {
      position: relative;
      width: 100vw;
      overflow: hidden;
    }
    #area-top {
      height: calc(50vh - 6px);
    }
    #area-bottom {
      height: calc(50vh - 6px);
    }
    .splitter {
      position: relative;
      width: 100vw;
      height: 12px;
      z-index: 20;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splitter-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 5px;
      height: 2px;
      background: #444;
    }
    .splitter-icon {
      position: relative;
      width: 24px;
      height: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .splitter-icon::before,
    .splitter-icon::after {
      content: '';
      display: block;
      width: 16px;
      height: 2px;
      background: #888;
      border-radius: 1px;
    }
    .edge-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25px;
      z-index: 10;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .edge-zone.left { left: 0; }
    .edge-zone.right { right: 0; }
    .edge-zone::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 40px;
      border: 1px solid #888;
      border-radius: 2px;
      opacity: 0.5;
      pointer-events: none;
      box-sizing: border-box;
    }
    .edge-zone.left::before { left: 0; }
    .edge-zone.right::before { right: 0; }
    .edge-zone::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      opacity: 0.5;
      pointer-events: none;
    }
    .edge-zone.left::after {
      left: 3px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 4px solid #888;
    }
    .edge-zone.right::after {
      right: 3px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 4px solid #888;
    }
    .carousel {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }
    .carousel.no-transition {
      transition: none;
    }
    .panel {
      flex: 0 0 100%;
      height: 100%;
      touch-action: none;
      position: relative;
      overflow: hidden;
    }
    .touch-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-label {
      color: #666;
      font-size: 1.2rem;
      pointer-events: none;
    }
    .tablet-surface {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The desktop video lives directly in #area-top, behind the carousel,
       so every panel is rendered on top of it (the panels are transparent). */
    .tablet-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
      z-index: 0;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    #area-top .carousel {
      position: relative;
      z-index: 1;
    }
    #area-top.has-video .panel[data-panel="tablet"] .touch-label {
      display: none;
    }
    .log-panel {
      display: flex;
      flex-direction: column;
      background: transparent;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .log-version {
      padding: 0.5rem;
      border-bottom: 1px solid #444;
      color: #888;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .fullscreen-btn {
      background: transparent;
      border: 1px solid #555;
      border-radius: 4px;
      color: #aaa;
      padding: 4px 6px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .fullscreen-btn:active { background: #2a2a2a; }
    .fullscreen-btn svg {
      display: block;
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fullscreen-btn .icon-exit { display: none; }
    .fullscreen-btn.is-fullscreen .icon-enter { display: none; }
    .fullscreen-btn.is-fullscreen .icon-exit { display: block; }
    .log-content {
      flex: 1;
      padding: 0.5rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0.1rem 0; }
    .ok { color: #6f6; }
    .err { color: #f66; }

    /* Full-screen passcode prompt, shown before any signaling starts when
       the server is started with a passcode. The body disables touch-action
       and user-select globally (for the touch panels), so the overlay must
       re-enable them or its input cannot be used. */
    #auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }
    #auth-overlay[hidden] { display: none; }
    #auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(80vw, 320px);
      text-align: center;
    }
    #auth-form h2 { margin: 0; font-weight: normal; }
    #auth-form p { margin: 0; color: #888; }
    #auth-passcode {
      font-size: 1.2rem;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #555;
      background: #1c1c1c;
      color: #eee;
      text-align: center;
    }
    #auth-submit {
      font-size: 1.1rem;
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      background: #3a7;
      color: #fff;
    }
    #auth-submit:disabled { opacity: 0.5; }
    #auth-error { color: #f66; }
  </style>
</head>
<body>
  <div class="area" id="area-top">
    <video class="tablet-video" autoplay muted playsinline></video>
    <div class="edge-zone left"></div>
    <div class="edge-zone right"></div>
    <div class="carousel">
      <div class="panel touch-panel" data-panel="trackpad">
        <div class="touch-label">Trackpad</div>
      </div>
      <div class="panel" data-panel="tablet">
        <div class="tablet-surface">
          <div class="touch-label">Tablet</div>
        </div>
      </div>
      <div class="panel log-panel" data-panel="log">
        <div class="log-version">
          <span class="log-version-text">v{{VERSION}}</span>
          <button type="button" class="fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
            <svg class="icon-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            <svg class="icon-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
          </button>
        </div>
        <div class="log-content">Connecting...</div>
      </div>
    </div>
  </div>

  <div class="splitter">
    <div class="splitter-line"></div>
    <div class="splitter-icon"></div>
  </div>

  <div class="area" id="area-bottom">
    <div class="edge-zone left"></div>
    <div class="edge-zone right"></div>
    <div class="carousel">
      <div class="panel touch-panel" data-panel="trackpad">
        <div class="touch-label">Trackpad</div>
      </div>
      <div class="panel" data-panel="tablet">
        <div class="tablet-surface">
          <div class="touch-label">Tablet</div>
        </div>
      </div>
      <div class="panel log-panel" data-panel="log">
        <div class="log-version">
          <span class="log-version-text">v{{VERSION}}</span>
          <button type="button" class="fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
            <svg class="icon-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            <svg class="icon-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
          </button>
        </div>
        <div class="log-content">Connecting...</div>
      </div>
    </div>
  </div>

  <div id="auth-overlay" hidden>
    <form id="auth-form" autocomplete="off">
      <h2>{{TITLE}}</h2>
      <p>This server requires a passcode</p>
      <input type="password" id="auth-passcode" autocomplete="current-password"
             enterkeyhint="go" placeholder="Passcode" required>
      <button type="submit" id="auth-submit">Connect</button>
      <div id="auth-error" hidden>Wrong passcode — try again</div>
    </form>
  </div>

  <script>window.APP_VERSION = "{{VERSION}}";</script>
  <script src="/app.js?v={{VERSION}}"></script>
</body>
</html>
