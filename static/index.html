<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Desktop Remote Trackpad</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #trackpad {
      height: 50vh;
      width: 100vw;
      background: #222;
      border-bottom: 2px solid #444;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #trackpad-label {
      color: #666;
      font-size: 1.2rem;
      pointer-events: none;
    }
    #status {
      height: 50vh;
      width: 100vw;
      padding: 0.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0.1rem 0; }
    .ok { color: #6f6; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <div id="trackpad">
    <div id="trackpad-label">Trackpad area</div>
  </div>
  <div id="status">Connecting...</div>
  <script src="/app.js"></script>
</body>
</html>
