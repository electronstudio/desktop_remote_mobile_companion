<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="app-version" content="{{VERSION}}">
  <title>Desktop Remote</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #trackpad {
      height: 50vh;
      width: 100vw;
      background: #222;
      border-bottom: 2px solid #444;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    #trackpad-label {
      color: #666;
      font-size: 1.2rem;
      pointer-events: none;
    }
    #status {
      height: 50vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 0.85rem;
    }
    #status-header {
      padding: 0.5rem;
      border-bottom: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: #1a1a1a;
      gap: 0.5rem;
    }
    #version {
      color: #888;
    }
    #mode {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.2rem 0.4rem;
    }
    #buttons {
      display: none;
      gap: 0.25rem;
    }
    #buttons.visible {
      display: flex;
    }
    .click-btn {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font: inherit;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .click-btn:active {
      background: #555;
    }
    #log {
      flex: 1;
      padding: 0.5rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0.1rem 0; }
    .ok { color: #6f6; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <div id="trackpad">
    <div id="trackpad-label">Touch area</div>
  </div>
  <div id="status">
    <div id="status-header">
      <span id="version">v{{VERSION}}</span>
      <div id="buttons">
        <button class="click-btn" data-button="left">L</button>
        <button class="click-btn" data-button="middle">M</button>
        <button class="click-btn" data-button="right">R</button>
      </div>
      <label>Mode: <select id="mode">
        <option value="trackpad" selected>Trackpad</option>
        <option value="tablet">Tablet</option>
      </select></label>
    </div>
    <div id="log">Connecting...</div>
  </div>
  <script>window.APP_VERSION = "{{VERSION}}";</script>
  <script src="/app.js?v={{VERSION}}"></script>
</body>
</html>
